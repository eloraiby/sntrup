name: sntrup

on:
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE-APACHE
      - LICENSE-MIT
  push:
    branches: main
    paths-ignore:
      - README.md
      - LICENSE-APACHE
      - LICENSE-MIT

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_LOG_STYLE: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: cargo build --features serde

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the production dispatcher, including SIMD selected for the runner.
          - name: native dispatch
            features: serde
          # Keep the portable implementation as both a supported fallback and a
          # differential guard against regressions in architecture-specific code.
          - name: forced scalar
            features: serde,force-scalar
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Test (${{ matrix.name }})
        run: cargo test --features ${{ matrix.features }} --all-targets --release

  test-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Test native NEON dispatch
        run: cargo test --features serde --all-targets --release
      - name: Compare with forced scalar
        run: cargo test --features serde,force-scalar --all-targets --release

  test-avx512-emulated:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu max
      SNTRUP_REQUIRE_AVX512: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Install user-mode x86 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
      - name: Exercise and require AVX-512 F/BW/VL kernels
        run: >-
          cargo test --target x86_64-unknown-linux-gnu --lib --release
          rq::vector::tests::avx512_elimination_matches_avx2

  feature-gates:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            flags: "--no-default-features"
          - name: kgen
            flags: "--no-default-features --features kgen"
          - name: ecap
            flags: "--no-default-features --features ecap"
          - name: dcap
            flags: "--no-default-features --features dcap"
          # Serde's format and rejection tests must remain independent of all
          # KEM-operation features so serialization can be adopted alone.
          - name: serde
            flags: "--no-default-features --features serde"
          # The RustCrypto trait integration is a public API surface of its own.
          - name: kem
            flags: "--no-default-features --features kem"
          # JavaScript entropy support must also compile without implicitly
          # enabling any key-generation or KEM operation.
          - name: js
            flags: "--no-default-features --features js"
          # Exercise every optional public integration together so dependency
          # feature unification cannot hide an incompatible combination.
          - name: kem+serde+js
            flags: "--no-default-features --features kem,serde,js"
          - name: kgen+ecap
            flags: "--no-default-features --features kgen,ecap"
          - name: kgen+dcap
            flags: "--no-default-features --features kgen,dcap"
          - name: ecap+dcap
            flags: "--no-default-features --features ecap,dcap"
          - name: kgen+ecap+dcap
            flags: "--no-default-features --features kgen,ecap,dcap"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Check (${{ matrix.name }})
        run: cargo check ${{ matrix.flags }}
      - name: Test (${{ matrix.name }})
        run: cargo test ${{ matrix.flags }} --lib --tests

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # Compile every production operation and public integration for the
      # browser target. Tests cannot execute on this bare WebAssembly target.
      - name: Check browser WebAssembly build
        run: >-
          cargo check --target wasm32-unknown-unknown --no-default-features
          --features kem,serde,js

  careful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624
      - run: cargo binstall --no-confirm cargo-careful
      - run: cargo careful test tests --features serde --release

  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      CARGO_TARGET_DIR: target/asan
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
          components: rust-src
      - name: Test memory safety with SIMD enabled
        run: cargo test -Z build-std --target x86_64-unknown-linux-gnu --release --all-targets

  address-sanitizer-aarch64:
    runs-on: ubuntu-24.04-arm
    env:
      ASAN_OPTIONS: detect_leaks=0
      CARGO_TARGET_DIR: target/asan-aarch64
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
          components: rust-src
      - name: Test native NEON memory safety
        run: cargo test -Z build-std --target aarch64-unknown-linux-gnu --release --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --features kem,serde -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: cargo doc --features kem,serde

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624
      - run: cargo binstall --no-confirm cargo-udeps
      - run: cargo udeps --all-targets --all-features

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624
      - name: Install RustSec scanner
        run: cargo binstall --no-confirm cargo-audit
      - name: Reject vulnerable or yanked locked dependencies
        run: cargo audit --deny warnings

  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624
      - run: cargo binstall --no-confirm cargo-outdated
      - run: cargo outdated --root-deps-only --ignore rand8,rand,sha2 --exit-code=1

  pants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624
      - run: cargo binstall --no-confirm cargo-pants
      - run: cargo pants --loud --dev
